          rel="stylesheet">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            My Product Gallery
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">

                <li class="nav-item">
                    <a class="nav-link" href="services.html">

                    <a class="nav-link active" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- CONTACT FORM -->

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Contact Us
                    </h2>


                    <form id="contactForm">


                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">

                                Name

                            </label>

                            <input type="text"
                                   id="name"
                                   class="form-control"
                                   placeholder="Enter your name">

                        </div>


                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">

                                Email

                            </label>

                            <input type="email"
                                   id="email"
                                   class="form-control"
                                   placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label for="subject"
                                   class="form-label">

                                Subject

                            </label>

                            <input type="text"
                                   id="subject"
                                   class="form-control"
                                   placeholder="Enter subject">

                        </div>


                        <div class="mb-3">

                            <label for="message"
                                   class="form-label">

                                Message

                            </label>

                            <textarea id="message"
                                      class="form-control"
                                      rows="5"
                                      placeholder="Enter your message"></textarea>

                        </div>


                        <button type="submit"
                                class="btn btn-primary">

                            Submit

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
